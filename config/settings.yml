devise_jwt_secret_key: <%= ENV.fetch('DEVISE_JWT_SECRET_KEY') { '1023asdkajasdfkljasdf90239sdf23sab' } %>
chat_gpt_api_key: <%= ENV.fetch("CHAT_GPT_API_KEY") { "" } %>

db:
  host: localhost
  user:
  pass:
  port: 5432
  # Pool size should be >= Sidekiq concurrency (20 in production)
  pool: <%= ENV.fetch('DB_POOL') { ENV.fetch('RAILS_MAX_THREADS') { 25 } } %>

# Used by Sidekiq and Redis session store. Empty = CookieStore for session; Sidekiq falls back to localhost.
redis_url: <%= ENV.fetch('REDIS_URL', '') %>

# OmniAuth. Leave blank to hide a provider. Callback: https://HOST/users/auth/:provider/callback
oauth:
  google:
    client_id: <%= ENV.fetch("GOOGLE_CLIENT_ID", "") %>
    client_secret: <%= ENV.fetch("GOOGLE_CLIENT_SECRET", "") %>
  apple:
    client_id: <%= ENV.fetch("APPLE_CLIENT_ID", "") %>
    team_id: <%= ENV.fetch("APPLE_TEAM_ID", "") %>
    key_id: <%= ENV.fetch("APPLE_KEY_ID", "") %>
    private_key: <%= ENV.fetch("APPLE_PRIVATE_KEY", "").gsub('\\n', "\n") %>
  facebook:
    app_id: <%= ENV.fetch("FACEBOOK_APP_ID", "") %>
    app_secret: <%= ENV.fetch("FACEBOOK_APP_SECRET", "") %>
  linkedin:
    client_id: <%= ENV.fetch("LINKEDIN_CLIENT_ID", "") %>
    client_secret: <%= ENV.fetch("LINKEDIN_CLIENT_SECRET", "") %>
