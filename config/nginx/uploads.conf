# UUID-sharded uploads under public/uploads.
#
#   /uploads/themes/<aa>/<bb>/<uuid>/default.yaml
#   /uploads/documents/<aa>/<bb>/<uuid>/cv.md
#
# <aa>/<bb> are the first four hex digits of the UUID (65_536 buckets).
# Point `alias` at the app's public/uploads (Kamal: /rails/public/uploads).

location /uploads/themes/ {
    alias /rails/public/uploads/themes/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
}

location /uploads/documents/ {
    alias /rails/public/uploads/documents/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
}
